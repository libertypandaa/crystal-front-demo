name: Deploy static demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test game rules
        run: |
          node tests/core-smoke.mjs
          node tests/cascade-chain.mjs
          node tests/lpa-foundation.mjs
      - name: Install browser test runner
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Test LPA browser lifecycle with mock host
        run: node tests/lpa-browser.mjs
      - name: Verify source manifest
        run: node scripts/verify-demo-release.mjs
      - name: Assemble Pages artifact
        run: |
          mkdir -p public/assets/generated/audio
          cp index.html release-manifest.json public/
          cp -R src public/
          cp -R assets/runtime public/assets/
          cp -R assets/generated/audio/core-sfx-kits-v1 public/assets/generated/audio/
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
